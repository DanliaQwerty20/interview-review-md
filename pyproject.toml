[project]
name = "interview-review-md"
version = "0.1.0"
description = "Turn an interview recording into a Markdown list of questions with timestamps."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "DanliaQwerty20" }]
dependencies = [
  "av>=14,<17",
  "faster-whisper>=1.2.0,<2",
  "openai>=2.0.0,<3",
  "pydantic>=2.9,<3",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

